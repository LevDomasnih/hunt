# A release is a raised version in main (node scripts/release.mjs <version>): tag v<version>, a GitHub release with the
# changelog section, and the Docker image ghcr.io/levdomasnih/hunt:<version> + :latest with the countries of hunt-data inside.
# Claude Code and Codex see the new plugin by the manifest's version; servers see it by the same version in main (src/updates.ts).
name: release

on:
  push:
    branches: [main]
    paths: [crm/src/version.ts]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: hunt
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: LevDomasnih/hunt-data
          path: hunt-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hunt/crm/package-lock.json
      - name: Version
        id: v
        working-directory: hunt
        run: |
          node scripts/release.mjs --check
          V=$(node -p "require('fs').readFileSync('crm/src/version.ts','utf8').match(/VERSION = '([^']+)'/)[1]")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes
        if: steps.v.outputs.new == 'true'
        working-directory: hunt
        run: |
          awk -v v="## ${{ steps.v.outputs.version }} (" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > ../notes.md
          cat ../notes.md
      - name: Tag and GitHub release
        if: steps.v.outputs.new == 'true'
        working-directory: hunt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --title "Hunt ${{ steps.v.outputs.version }}" --notes-file ../notes.md
      - name: Countries for the image
        if: steps.v.outputs.new == 'true'
        working-directory: hunt/crm
        run: node scripts/copy-art.mjs --no-demo
      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.new == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.new == 'true'
      - uses: docker/login-action@v3
        if: steps.v.outputs.new == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Docker image
        if: steps.v.outputs.new == 'true'
        uses: docker/build-push-action@v6
        with:
          context: hunt/crm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/levdomasnih/hunt:${{ steps.v.outputs.version }}
            ghcr.io/levdomasnih/hunt:latest
          labels: |
            org.opencontainers.image.source=https://github.com/LevDomasnih/hunt
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
