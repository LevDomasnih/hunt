<html><head><meta charset="utf-8">
<script type="importmap">

  "three": "/node_modules/three/build/three.module.js",

} }

</head><body style="margin:0;background:transparent">
<script type="module">
import { renderToy } from '/toy.js';

async function downscale(url, out) {
  const img = new Image(); img.src = url; await img.decode();
  // two-step halving keeps the edges clean
  let src = img, w = img.width;
  while (w / 2 >= out) {
    const c = document.createElement('canvas'); c.width = c.height = w / 2;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(src, 0, 0, w / 2, w / 2); src = c; w = w / 2;
  }
  return src;
}

window.render = async (svg, opts) => {
  const out = opts.out || 512;
  const urls = await renderToy(svg, { size: out * 2, frames: opts.frames });
  const canv = [];
  for (const u of urls) canv.push(await downscale(u, out));
  const still = canv[0].toDataURL('image/png');
  let strip = null;
  if (canv.length > 1) {
    const s = document.createElement('canvas'); s.width = out * (canv.length - 1); s.height = out;
    const x = s.getContext('2d');
    canv.slice(1).forEach((c, i) => x.drawImage(c, i * out, 0));
    strip = s.toDataURL('image/png');
  }
  return { still, strip };
};
window.ready = true;
</script>
</body></html>
